<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventário ALM51 — Valorizado</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#14181c;--panel:#1c2228;--line:#2c353d;--ink:#e8ecef;--soft:#8b98a3;--red:#ef6f6c;--green:#2fcf8a;--amber:#f2a94a;--blue:#4aa8e8;font-size:15px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;padding:16px 20px 28px}
.num,td.n,.kv{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
h1{margin:0;font-size:1.55rem;font-weight:700}
.sub{color:var(--soft);font-size:.8rem;margin-top:4px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 12px;font:600 .8rem Inter,sans-serif;cursor:pointer}
button:hover{border-color:var(--amber)}button:focus-visible,select:focus-visible{outline:2px solid var(--amber)}
button.pri{background:var(--amber);color:#1b1305;border-color:var(--amber)}
button.on{border-color:var(--green);color:var(--green)}
input[type=file]{display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c,#555);border-radius:8px;padding:12px 14px}
.kpi .l{font-size:.72rem;color:var(--soft);font-weight:600}
.kpi .v{font-family:'JetBrains Mono',monospace;font-size:1.55rem;font-weight:700;margin:4px 0 2px;white-space:nowrap}
.kpi .s{font-size:.72rem;color:var(--soft)}
.grid{display:grid;grid-template-columns:3fr 2fr;gap:12px}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto}
.box h2{margin:0 0 10px;font-size:.85rem;font-weight:700}
.box h2 small{color:var(--soft);font-weight:400;margin-left:6px}
table{width:100%;border-collapse:collapse;font-size:.78rem}
th{color:var(--soft);font-weight:600;text-align:right;padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 6px;border-bottom:1px solid #232b32;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr.rua{cursor:pointer}tr.rua:hover td{background:#222a31}
.neg{color:var(--red)}.pos{color:var(--amber)}.ok{color:var(--green)}
.div{position:relative;height:14px;min-width:150px;background:#232b32;border-radius:3px}
.div:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#556}
.div i{position:absolute;top:2px;bottom:2px;border-radius:2px}
.acc{display:inline-block;width:70px;height:8px;background:#232b32;border-radius:4px;vertical-align:middle;margin-right:6px;overflow:hidden}
.acc i{display:block;height:100%}
.msg{padding:30px;text-align:center;color:var(--soft)}
.warn{margin-top:10px;font-size:.76rem;color:var(--amber)}
#toast{position:fixed;right:16px;bottom:16px;background:#222a31;border:1px solid var(--line);padding:10px 14px;border-radius:8px;font-size:.82rem;display:none;max-width:360px}
html.tv{font-size:20px}
body.tv{padding:1.5vh 2.2vw}body.tv .ctrl button:not(#tvBtn),body.tv .ctrl select{display:none}
body.tv .kpi .v{font-size:2.1rem}body.tv .kpi .l,body.tv .kpi .s{font-size:.85rem}
body.tv .box{overflow:visible}body.tv table{font-size:.92rem}body.tv .sub{font-size:.9rem}body.tv .kpis{grid-template-columns:repeat(6,1fr)}
</style>
</head>
<body>
<header>
  <div>
    <h1>Inventário ALM51 — Valorizado</h1>
    <div class="sub" id="meta">Carregando dados…</div>
  </div>
  <div class="ctrl">
    <select id="rua" aria-label="Filtrar por rua"><option value="">Todas as ruas</option></select>
    <button class="pri" id="impCont">Importar contagem</button>
    <button id="impCost">Importar custos (OSR_CMM)</button>
    <button id="autoBtn" class="on">Auto: ligado</button>
    <button id="tvBtn">Modo TV</button>
    <input type="file" id="fCont" accept=".xlsx,.xls"><input type="file" id="fCost" accept=".xlsx,.xls">
  </div>
</header>
<div class="kpis" id="kpis"></div>
<div class="grid">
  <div class="box"><h2>Resultado por rua<small>clique numa rua para filtrar</small></h2><div id="tRua"></div></div>
  <div class="box"><h2>Maiores divergências<small>em valor absoluto</small></h2><div id="tTop"></div><div class="warn" id="warn"></div></div>
</div>
<div id="toast" role="status"></div>
<script>
const TOOL='inventario-alm51', INSIDE=window.parent!==window;
let D={costs:{},rows:[],updatedAt:0,costsAt:0,rowsAt:0}, auto=true, busy=false, filtro='';
const $=id=>document.getElementById(id);
const BRL=v=>(v<0?'-':'')+'R$ '+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const PCT=v=>(v*100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
const INT=v=>v.toLocaleString('pt-BR');
const when=t=>t?new Date(t).toLocaleString('pt-BR'):'nunca';
function toast(m,ms=4500){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',ms)}

/* ---------- Persistência (Firebase via painel) ---------- */
let pend={};
window.addEventListener('message',e=>{
  const m=e.data;if(!m||m.tool!==TOOL)return;
  if(m.type==='painel:data'){
    const p=m.payload;
    if(p&&p.updatedAt&&p.updatedAt!==D.updatedAt&&!busy){
      D={updatedAt:p.updatedAt,costsAt:p.costsAt||0,rowsAt:p.rowsAt||0,costs:JSON.parse(p.costs||'{}'),rows:JSON.parse(p.rows||'[]')};
      fillRuas();render();
    }else if(!p&&!D.rows.length)render();
  }
  if(m.type==='painel:save-ack'&&pend.r){m.ok?pend.r():pend.j(new Error(m.error||'falha ao salvar'));pend={}}
});
function load(){
  if(INSIDE)parent.postMessage({type:'painel:request-data',tool:TOOL},'*');
  else try{const s=localStorage.getItem(TOOL);if(s)window.postMessage({type:'painel:data',tool:TOOL,payload:JSON.parse(s)},'*');else render()}catch(e){render()}
}
function save(){
  D.updatedAt=Date.now();
  const payload={updatedAt:D.updatedAt,costsAt:D.costsAt,rowsAt:D.rowsAt,costs:JSON.stringify(D.costs),rows:JSON.stringify(D.rows)};
  if(!INSIDE){try{localStorage.setItem(TOOL,JSON.stringify(payload))}catch(e){}return Promise.resolve()}
  return new Promise((r,j)=>{pend={r,j};parent.postMessage({type:'painel:save-data',tool:TOOL,payload},'*');setTimeout(()=>{if(pend.j){pend.j(new Error('tempo esgotado'));pend={}}},50000)});
}

/* ---------- Importação ---------- */
const readSheet=f=>f.arrayBuffer().then(b=>{const wb=XLSX.read(b,{type:'array'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})});
const num=v=>{if(typeof v==='number')return v;const n=parseFloat(String(v).replace(/\./g,'').replace(',','.'));return isNaN(n)?null:n};
async function importar(file,tipo){
  if(!file)return;busy=true;toast('Lendo '+file.name+'…',60000);
  try{
    const sh=await readSheet(file);
    if(tipo==='cost'){
      const hi=sh.findIndex(r=>r.includes('ITEM NUMBER')),h=sh[hi],ci=h.indexOf('ITEM COST'),ni=h.indexOf('ITEM NUMBER');
      if(hi<0||ci<0)throw new Error('Não achei as colunas ITEM NUMBER / ITEM COST.');
      const c={};sh.slice(hi+1).forEach(r=>{const k=String(r[ni]).trim(),v=num(r[ci]);if(k&&v!==null)c[k]=Math.round(v*1e4)/1e4});
      D.costs=c;D.costsAt=Date.now();
    }else{
      const hi=sh.findIndex(r=>r.includes('Plano')&&r.includes('Peça')),h=sh[hi];
      if(hi<0)throw new Error('Não achei as colunas Plano / Peça.');
      const ix=n=>h.indexOf(n),P=ix('Plano'),E=ix('Endereço'),C=ix('Peça'),S=ix('Sistema'),F=ix('Final'),Z=ix('Fechou na'),T=ix('Status');
      D.rows=sh.slice(hi+1).filter(r=>r[P]&&r[C]).map(r=>{
        const fechou=['1ª','2ª','3ª'].includes(String(r[Z]).trim())&&num(r[F])!==null;
        return [String(r[P]).replace(/^ALM51\s*/i,'').trim(),String(r[E]),String(r[C]).trim(),num(r[S])||0,fechou?num(r[F]):null,fechou?String(r[Z]).trim():'',String(r[T])];
      });
      D.rowsAt=Date.now();
    }
    await save();fillRuas();render();toast('Importado e salvo no Firebase ✔');
  }catch(e){toast('Erro: '+e.message,8000)}
  busy=false;
}

/* ---------- Cálculo ---------- */
function calc(rows){
  const R={tot:rows.length,fech:0,sis:0,falta:0,sobra:0,pecasOk:0,semCusto:new Set(),itens:[]};
  rows.forEach(r=>{
    if(r[4]===null)return;R.fech++;
    const cost=D.costs[r[2]],diff=r[4]-r[3];
    if(diff===0)R.pecasOk++;
    if(cost===undefined){R.semCusto.add(r[2]);return}
    R.sis+=r[3]*cost;
    if(diff<0)R.falta+=-diff*cost;else if(diff>0)R.sobra+=diff*cost;
    if(diff)R.itens.push({rua:r[0],end:r[1],peca:r[2],sis:r[3],fin:r[4],diff,val:diff*cost,fec:r[5]});
  });
  R.net=R.sobra-R.falta;R.bruto=R.sobra+R.falta;R.acc=R.sis>0?Math.max(0,1-R.bruto/R.sis):null;
  return R;
}
function fillRuas(){
  const s=$('rua'),ruas=[...new Set(D.rows.map(r=>r[0]))].sort((a,b)=>(parseInt(a.replace(/\D/g,''))||0)-(parseInt(b.replace(/\D/g,''))||0));
  s.innerHTML='<option value="">Todas as ruas</option>'+ruas.map(r=>`<option>${r}</option>`).join('');s.value=ruas.includes(filtro)?filtro:(filtro='');
}
const cls=v=>v<0?'neg':v>0?'pos':'';
const accCol=a=>a===null?'#555':a>=.98?'var(--green)':a>=.95?'var(--amber)':'var(--red)';

function render(){
  $('meta').textContent=`Contagem importada: ${when(D.rowsAt)} · Custos: ${when(D.costsAt)}${Object.keys(D.costs).length?' ('+INT(Object.keys(D.costs).length)+' itens)':''} · Atualizado ${new Date().toLocaleTimeString('pt-BR')}`;
  if(!D.rows.length||!Object.keys(D.costs).length){
    $('kpis').innerHTML='';$('tRua').innerHTML=$('tTop').innerHTML='';
    $('tRua').innerHTML=`<div class="msg">Importe a <b>contagem</b> e a planilha de <b>custos (OSR_CMM)</b> para ver o resultado.</div>`;return;
  }
  const all=calc(D.rows),sel=filtro?calc(D.rows.filter(r=>r[0]===filtro)):all;
  const K=(l,v,s,c)=>`<div class="kpi" style="--c:${c}"><div class="l">${l}</div><div class="v ${c==='var(--red)'?'neg':''}">${v}</div><div class="s">${s}</div></div>`;
  $('kpis').innerHTML=
    K('Divergência p/ menor',BRL(-sel.falta),'falta física vs. sistema','var(--red)')+
    K('Divergência p/ maior',BRL(sel.sobra),'sobra física vs. sistema','var(--amber)')+
    K('NET (maior − menor)',BRL(sel.net),'bruto: '+BRL(sel.bruto),sel.net<0?'var(--red)':'var(--blue)')+
    K('Acuracidade em valor',sel.acc===null?'—':PCT(sel.acc),'1 − bruto ÷ valor do sistema','var(--green)')+
    K('Valor contado (sistema)',BRL(sel.sis),INT(sel.fech)+' posições fechadas','var(--blue)')+
    K('Posições fechadas',PCT(sel.fech/sel.tot),`${INT(sel.fech)} de ${INT(sel.tot)} · ${PCT(sel.pecasOk/Math.max(sel.fech,1))} sem divergência`,'#8b98a3');
  /* por rua */
  const ruas=[...new Set(D.rows.map(r=>r[0]))].sort((a,b)=>(parseInt(a.replace(/\D/g,''))||0)-(parseInt(b.replace(/\D/g,''))||0));
  const data=ruas.map(r=>({r,...calc(D.rows.filter(x=>x[0]===r))}));
  const mx=Math.max(...data.map(d=>Math.max(d.falta,d.sobra)),1);
  let h='<table><tr><th>Rua</th><th>Fechado</th><th>Valor sistema</th><th>Menor</th><th>Maior</th><th>NET</th><th style="min-width:150px">Menor ◂ ▸ Maior</th><th>Acuracidade</th></tr>';
  data.forEach(d=>{h+=`<tr class="rua" data-r="${d.r}" style="${d.r===filtro?'background:#222a31':''}"><td><b>${d.r}</b></td><td class="n">${PCT(d.fech/d.tot)}</td><td class="n">${BRL(d.sis)}</td><td class="n neg">${BRL(-d.falta)}</td><td class="n pos">${BRL(d.sobra)}</td><td class="n ${cls(d.net)}">${BRL(d.net)}</td>
   <td><div class="div"><i style="right:50%;width:${d.falta/mx*50}%;background:var(--red)"></i><i style="left:50%;width:${d.sobra/mx*50}%;background:var(--amber)"></i></div></td>
   <td class="n"><span class="acc"><i style="width:${(d.acc||0)*100}%;background:${accCol(d.acc)}"></i></span>${d.acc===null?'—':PCT(d.acc)}</td></tr>`});
  h+=`<tr><td><b>Total</b></td><td class="n">${PCT(all.fech/all.tot)}</td><td class="n">${BRL(all.sis)}</td><td class="n neg">${BRL(-all.falta)}</td><td class="n pos">${BRL(all.sobra)}</td><td class="n ${cls(all.net)}">${BRL(all.net)}</td><td></td><td class="n">${all.acc===null?'—':PCT(all.acc)}</td></tr></table>`;
  $('tRua').innerHTML=h;
  document.querySelectorAll('tr.rua').forEach(tr=>tr.onclick=()=>{filtro=filtro===tr.dataset.r?'':tr.dataset.r;$('rua').value=filtro;render()});
  /* top divergências */
  const top=sel.itens.sort((a,b)=>Math.abs(b.val)-Math.abs(a.val)).slice(0,document.documentElement.classList.contains('tv')?24:15);
  $('tTop').innerHTML=top.length?'<table><tr><th>Peça</th><th>End.</th><th>Sist.</th><th>Final</th><th>Valor</th></tr>'+top.map(i=>`<tr><td>${i.peca}</td><td>${i.end}</td><td class="n">${i.sis}</td><td class="n">${i.fin}</td><td class="n ${cls(i.val)}">${BRL(i.val)}</td></tr>`).join('')+'</table>':'<div class="msg">Nenhuma divergência nas posições fechadas.</div>';
  $('warn').textContent=sel.semCusto.size?`⚠ ${sel.semCusto.size} peça(s) fechada(s) sem custo no OSR_CMM ficaram fora do valor: ${[...sel.semCusto].slice(0,6).join(', ')}${sel.semCusto.size>6?'…':''}`:'';
  fitTV();
}

/* ---------- Ajuste automático à tela (Modo TV) ---------- */
function fitTV(){
  const r=document.documentElement;
  if(!r.classList.contains('tv')){r.style.fontSize='';return}
  let s=parseFloat(r.style.fontSize)||20;
  for(let i=0;i<6;i++){
    r.style.fontSize=s+'px';
    const k=Math.min(innerHeight/document.body.scrollHeight,innerWidth/Math.max(r.scrollWidth,innerWidth));
    if(k>.98&&k<1.03)break;
    s=Math.max(12,Math.min(48,s*k*.99));
  }
  r.style.fontSize=s+'px';
}
addEventListener('resize',()=>setTimeout(fitTV,150));

/* ---------- Eventos ---------- */
$('impCont').onclick=()=>$('fCont').click();$('impCost').onclick=()=>$('fCost').click();
$('fCont').onchange=e=>{importar(e.target.files[0],'cont');e.target.value=''};
$('fCost').onchange=e=>{importar(e.target.files[0],'cost');e.target.value=''};
$('rua').onchange=e=>{filtro=e.target.value;render()};
$('autoBtn').onclick=e=>{auto=!auto;e.target.textContent='Auto: '+(auto?'ligado':'desligado');e.target.classList.toggle('on',auto)};
$('tvBtn').onclick=()=>{const on=document.body.classList.toggle('tv');document.documentElement.classList.toggle('tv',on);$('tvBtn').textContent=on?'Sair do modo TV':'Modo TV';
  try{on?document.documentElement.requestFullscreen():document.fullscreenElement&&document.exitFullscreen()}catch(e){}
  render();};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('tv')){document.body.classList.remove('tv');document.documentElement.classList.remove('tv');$('tvBtn').textContent='Modo TV';render()}});
setInterval(()=>{if(auto&&!busy)load()},60000);   /* auto-atualização a cada 60 s */
setInterval(()=>{if(auto&&!busy&&D.rows.length)render()},30000);
load();
</script>
</body>
</html>
