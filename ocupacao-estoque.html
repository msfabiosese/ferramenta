<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ocupação de Estoque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#EEF1F5;
    --panel:#FFFFFF;
    --panel-2:#F7F9FB;
    --ink:#182430;
    --ink-soft:#5A6B7B;
    --line:#DFE4EA;
    --steel:#274C77;
    --steel-dark:#1B3A5C;
    --steel-light:#4E7EAE;
    --amber:#C8791C;
    --amber-bg:#FBEEDC;
    --green:#2E8B57;
    --green-bg:#E4F4EA;
    --red:#C4453D;
    --red-bg:#FBE7E5;
    --radius:10px;
    --shadow:0 1px 2px rgba(20,30,45,.06), 0 1px 12px rgba(20,30,45,.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    font-size:14px;
    line-height:1.45;
    padding:28px;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .wrap{max-width:1360px;margin:0 auto;}

  /* Header */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
    margin-bottom:22px;
    padding-bottom:18px;
    border-bottom:2px solid var(--steel-dark);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:40px;height:40px;border-radius:8px;
    background:linear-gradient(135deg,var(--steel-dark),var(--steel-light));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:16px;font-family:'IBM Plex Mono',monospace;
    flex-shrink:0;
  }
  h1{font-size:21px;font-weight:600;margin:0;letter-spacing:-.01em;}
  .subtitle{color:var(--ink-soft);font-size:12.5px;margin-top:3px;}
  .actions{display:flex;gap:10px;flex-wrap:wrap;}
  button.btn{
    font-family:inherit;font-size:13px;font-weight:500;
    border:1px solid var(--line);background:var(--panel);
    color:var(--ink);padding:9px 14px;border-radius:8px;
    cursor:pointer;display:flex;align-items:center;gap:7px;
    transition:border-color .15s, box-shadow .15s;
  }
  button.btn:hover{border-color:var(--steel-light);box-shadow:var(--shadow);}
  button.btn.primary{background:var(--steel);border-color:var(--steel);color:#fff;}
  button.btn.primary:hover{background:var(--steel-dark);}
  button.btn svg{flex-shrink:0;}
  input[type=file]{display:none;}

  .filebar{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    color:var(--ink-soft);font-size:12px;margin-top:10px;
  }
  .pill{
    background:var(--panel-2);border:1px solid var(--line);
    border-radius:6px;padding:4px 9px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;
  }

  /* KPI row */
  .kpis{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:12px;
    margin-bottom:20px;
  }
  @media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:620px){.kpis{grid-template-columns:repeat(2,1fr);}}
  .kpi{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;box-shadow:var(--shadow);
  }
  .kpi-label{
    font-size:10.5px;letter-spacing:.04em;color:var(--ink-soft);
    display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;
  }
  .kpi-value{font-size:24px;font-weight:600;font-family:'IBM Plex Mono',monospace;letter-spacing:-.01em;}
  .kpi-sub{font-size:11px;color:var(--ink-soft);margin-top:3px;}
  .kpi.accent .kpi-value{color:var(--steel);}
  .kpi.warn .kpi-value{color:var(--amber);}

  /* Layout grid */
  .grid{
    display:grid;
    grid-template-columns:1.7fr 0.85fr 0.85fr;
    gap:16px;
    align-items:start;
  }
  @media(max-width:1180px){.grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:760px){.grid{grid-template-columns:1fr;}}

  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;
  }
  .panel-head{
    padding:13px 16px;border-bottom:1px solid var(--line);
    font-size:12.5px;font-weight:600;color:var(--steel-dark);
    display:flex;align-items:center;gap:8px;
    background:var(--panel-2);
  }
  .panel-body{padding:0;}
  .panel-body.pad{padding:14px 16px;}

  table{width:100%;border-collapse:collapse;font-size:12px;}
  thead th{
    text-align:left;font-weight:600;color:var(--ink-soft);
    font-size:10px;letter-spacing:.03em;
    padding:6px 10px;border-bottom:1px solid var(--line);
    background:var(--panel-2);position:sticky;top:0;
  }
  tbody td{padding:4px 10px;border-bottom:1px solid var(--line);vertical-align:middle;line-height:1.2;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFBFD;}
  td.num,th.num{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .tipo-cell{font-weight:600;color:var(--steel-dark);font-size:11px;}
  .tipo-cell .almacen{display:block;font-weight:400;color:var(--ink-soft);font-size:9.5px;margin-top:1px;}
  .fam-cell{color:var(--ink);}
  tfoot td{
    padding:7px 10px;font-weight:700;border-top:2px solid var(--steel-dark);
    background:var(--panel-2);font-family:'IBM Plex Mono',monospace;
  }
  tfoot td.label{font-family:'IBM Plex Sans',sans-serif;}

  .badge{
    display:inline-flex;align-items:center;gap:4px;
    padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600;
    font-family:'IBM Plex Mono',monospace;
  }
  .badge .dot{width:6px;height:6px;border-radius:50%;}
  .badge.ok{background:var(--green-bg);color:var(--green);}
  .badge.ok .dot{background:var(--green);}
  .badge.mid{background:var(--amber-bg);color:var(--amber);}
  .badge.mid .dot{background:var(--amber);}
  .badge.crit{background:var(--red-bg);color:var(--red);}
  .badge.crit .dot{background:var(--red);}

  /* Sidebar */
  .side-stack{display:flex;flex-direction:column;gap:16px;}
  .armazem-row{padding:12px 16px;border-bottom:1px solid var(--line);}
  .armazem-row:last-child{border-bottom:none;}
  .armazem-name{font-weight:600;font-size:12.5px;margin-bottom:6px;}
  .bar-track{
    height:8px;background:var(--panel-2);border-radius:5px;overflow:hidden;
    display:flex;border:1px solid var(--line);
  }
  .bar-fill{background:var(--steel);height:100%;}
  .armazem-meta{display:flex;justify-content:space-between;color:var(--ink-soft);font-size:11px;margin-top:6px;font-family:'IBM Plex Mono',monospace;}

  .og-panel{padding:22px 16px 20px;text-align:center;}
  .og-value{font-family:'IBM Plex Mono',monospace;font-size:32px;font-weight:700;color:var(--steel-dark);letter-spacing:-.01em;}
  .og-label{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .og-ring{margin:14px auto 12px;}
  .og-legend{display:flex;justify-content:center;gap:16px;font-size:11px;color:var(--ink-soft);margin-top:4px;}
  .og-legend span{display:inline-flex;align-items:center;gap:5px;}
  .og-legend .sw{width:9px;height:9px;border-radius:2px;display:inline-block;}

  .date-bar{
    display:flex;align-items:center;gap:8px;
    background:var(--steel-dark);color:#fff;border-radius:var(--radius);
    padding:10px 16px;font-size:12.5px;font-weight:500;
    box-shadow:var(--shadow);
  }
  .date-bar svg{flex-shrink:0;opacity:.85;}
  .date-bar b{font-family:'IBM Plex Mono',monospace;font-weight:600;letter-spacing:.01em;}

  .hist-scroll{max-height:520px;overflow-y:auto;}

  .hist-row{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line);font-size:12px;}
  .hist-row:last-child{border-bottom:none;}
  .hist-date{color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:11.5px;}
  .trend{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;}
  .trend.up{color:var(--red);}
  .trend.down{color:var(--green);}
  .trend.flat{color:var(--ink-soft);}

  .empty{
    padding:70px 24px;text-align:center;color:var(--ink-soft);
  }
  .empty svg{opacity:.35;margin-bottom:14px;}
  .empty h2{font-size:16px;color:var(--ink);margin:0 0 6px;}
  .empty p{font-size:13px;max-width:420px;margin:0 auto;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--steel-dark);color:#fff;padding:11px 18px;border-radius:8px;
    font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.2);
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.error{background:var(--red);}

  footer{text-align:right;color:var(--ink-soft);font-size:11px;margin-top:22px;}

  td.disp-cell{cursor:pointer;color:var(--steel);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;}
  td.disp-cell:hover{color:var(--steel-dark);}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,22,32,.5);
    display:flex;align-items:center;justify-content:center;
    z-index:100;padding:24px;
  }
  .modal-box{
    background:var(--panel);border-radius:12px;max-width:560px;width:100%;
    max-height:80vh;display:flex;flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
  }
  .modal-head{
    padding:16px 20px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  }
  .modal-title{font-size:14.5px;font-weight:600;color:var(--steel-dark);}
  .modal-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .modal-close{
    background:none;border:none;cursor:pointer;color:var(--ink-soft);
    padding:4px;border-radius:6px;flex-shrink:0;
  }
  .modal-close:hover{background:var(--panel-2);color:var(--ink);}
  .modal-body{overflow-y:auto;padding:0;}
  .modal-body table{width:100%;}
  .modal-body thead th{position:sticky;top:0;}
  .modal-actions{
    display:flex;gap:8px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel-2);
  }
  .modal-actions button{
    font-family:inherit;font-size:12px;font-weight:500;
    border:1px solid var(--line);background:var(--panel);color:var(--ink);
    padding:6px 11px;border-radius:7px;cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }
  .modal-actions button:hover{border-color:var(--steel-light);}

  @media print{
    body *{visibility:hidden;}
    .modal-overlay, .modal-overlay *{visibility:visible;}
    .modal-overlay{position:absolute;inset:0;background:#fff;padding:0;display:block;}
    .modal-box{box-shadow:none;max-height:none;max-width:none;width:100%;border-radius:0;}
    .modal-body{overflow:visible;}
    .modal-close, .modal-actions{display:none !important;}
  }
  .modal-foot{padding:11px 20px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-soft);background:var(--panel-2);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-mark">OC</div>
      <div>
        <h1>Ocupação de Estoque por Família</h1>
        <div class="subtitle" id="subtitle">Nenhum dado carregado ainda</div>
      </div>
    </div>
    <div>
      <div class="actions">
        <button class="btn" id="btnCap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Atualizar capacidades
        </button>
        <button class="btn primary" id="btnStock">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Importar estoque
        </button>
      </div>
      <div class="filebar">
        <span class="pill" id="capPill">capacidades: —</span>
        <span class="pill" id="stockPill">estoque: —</span>
      </div>
    </div>
    <input type="file" id="capInput" accept=".xlsx,.xls,.csv">
    <input type="file" id="stockInput" accept=".csv">
  </header>

  <div id="app"></div>

  <footer>Ferramenta local — os arquivos são lidos no seu navegador e nada é enviado a servidores externos.</footer>
</div>

<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
/* ---------------------------------------------------------------
   STORAGE HELPERS
   Works in two contexts:
   1) Inside the Claude.ai artifact panel -> uses window.storage (synced by Anthropic)
   2) Downloaded and opened as a standalone .html file -> falls back to
      the browser's localStorage, which persists on disk between sessions
      as long as you keep opening the file from the same location/browser.
--------------------------------------------------------------- */
const NS = 'ocupacao-estoque:';
const hasAnthropicStorage = () => (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.set === 'function');

async function storeSet(key, value){
  if(hasAnthropicStorage()){
    try{ await window.storage.set(key, JSON.stringify(value), false); return; }
    catch(e){ console.warn('window.storage indisponível, usando localStorage', e); }
  }
  try{ localStorage.setItem(NS+key, JSON.stringify(value)); }
  catch(e){ console.error('storage set failed', e); }
}
async function storeGet(key){
  if(hasAnthropicStorage()){
    try{
      const r = await window.storage.get(key, false);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ /* fall through to localStorage */ }
  }
  try{
    const v = localStorage.getItem(NS+key);
    return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}
async function storeList(prefix){
  if(hasAnthropicStorage()){
    try{
      const r = await window.storage.list(prefix, false);
      if(r) return r.keys;
    }catch(e){ /* fall through to localStorage */ }
  }
  try{
    const out = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(NS+prefix)) out.push(k.slice(NS.length));
    }
    return out;
  }catch(e){ return []; }
}

/* ---------------------------------------------------------------
   STATE
--------------------------------------------------------------- */
let capacityRows = null;   // [{loc, almacen, tipo, familia, capacidade}]
let capacityMeta = null;   // {filename, importedAt}
let stockCounts = null;    // { locCode: nEmbalagens }
let stockMeta = null;      // {filename, importedAt, totalLinhas}
let currentStats = null;   // last computeOccupancy() result, cached for the popup

/* ---------------------------------------------------------------
   UTIL
--------------------------------------------------------------- */
function norm(s){
  return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}
function findCol(headers, candidates){
  const normed = headers.map(norm);
  for(const cand of candidates){
    const idx = normed.indexOf(norm(cand));
    if(idx !== -1) return headers[idx];
  }
  return null;
}
function fmtInt(n){ return Math.round(n).toLocaleString('pt-BR'); }
function fmtPct(n){ return n.toFixed(2).replace('.', ',') + '%'; }
function pctClass(p){
  if(p >= 90) return 'crit';
  if(p >= 70) return 'mid';
  return 'ok';
}
function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>{ t.className='toast'; }, 3200);
}
function titleCase(s){
  return (s||'').toString().trim();
}

/* ---------------------------------------------------------------
   PARSE CAPACITY FILE (xlsx or csv)
   Expected columns (case/accent-insensitive):
   Localização, Almacen, Tipo de Armazenagem, Familia, Capacidade
--------------------------------------------------------------- */
function parseCapacityWorkbookRows(rows){
  // rows: array of arrays, first row = header
  const headers = rows[0].map(h => (h||'').toString());
  const cLoc = findCol(headers, ['Localização','Localizacion','Localizacao','Location']);
  const cAlm = findCol(headers, ['almacen','Almacém','Armazem']);
  const cTipo = findCol(headers, ['TIPO DE ARMAZENAGEM','Tipo Armazenagem','Tipo']);
  const cFam = findCol(headers, ['FAMILIA','Família']);
  const cCap = findCol(headers, ['CAPACIDADE','.CAPACIDADE','Capacidade Total']);
  if(!cLoc || !cTipo || !cFam || !cCap){
    throw new Error('Não encontrei as colunas esperadas (Localização, Tipo de Armazenagem, Familia, Capacidade) no arquivo de capacidades.');
  }
  const idx = {
    loc: headers.indexOf(cLoc),
    alm: cAlm ? headers.indexOf(cAlm) : -1,
    tipo: headers.indexOf(cTipo),
    fam: headers.indexOf(cFam),
    cap: headers.indexOf(cCap),
  };
  const out = [];
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r) continue;
    const loc = r[idx.loc];
    const tipo = r[idx.tipo];
    const fam = r[idx.fam];
    let cap = r[idx.cap];
    if(loc === undefined || loc === null || loc === '' || tipo === undefined || tipo === '' ) continue;
    cap = parseFloat(cap);
    if(isNaN(cap)) cap = 0;
    out.push({
      loc: loc.toString().trim(),
      almacen: idx.alm !== -1 ? (r[idx.alm]||'').toString().trim() : '',
      tipo: (tipo||'').toString().trim(),
      familia: (fam||'').toString().trim(),
      capacidade: cap,
    });
  }
  return out;
}

function handleCapacityFile(file){
  const name = file.name.toLowerCase();
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      let rows;
      if(name.endsWith('.csv')){
        const parsed = Papa.parse(e.target.result, {skipEmptyLines:true});
        rows = parsed.data;
      } else {
        const wb = XLSX.read(e.target.result, {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      }
      const parsedRows = parseCapacityWorkbookRows(rows);
      if(parsedRows.length === 0) throw new Error('Nenhuma linha válida encontrada no arquivo de capacidades.');
      capacityRows = parsedRows;
      capacityMeta = {filename: file.name, importedAt: new Date().toISOString()};
      await storeSet('capacity-data', {rows: capacityRows, meta: capacityMeta});
      savePainelData();
      showToast('Capacidades atualizadas: ' + capacityRows.length + ' posições carregadas.');
      render();
    }catch(err){
      console.error(err);
      showToast('Erro ao importar capacidades: ' + err.message, true);
    }
  };
  if(name.endsWith('.csv')) reader.readAsText(file, 'utf-8');
  else reader.readAsArrayBuffer(file);
}

/* ---------------------------------------------------------------
   PARSE STOCK CSV
   Expected columns: Ubicacion (position code) — one row = one embalagem
--------------------------------------------------------------- */
function handleStockFile(file){
  Papa.parse(file, {
    header:true,
    skipEmptyLines:true,
    encoding:'utf-8',
    complete: async (results) => {
      try{
        const headers = results.meta.fields || [];
        const cUb = findCol(headers, ['Ubicacion','Ubicación','Localização','Location']);
        if(!cUb) throw new Error('Não encontrei a coluna "Ubicacion" no arquivo de estoque.');
        const counts = {};
        let total = 0;
        for(const row of results.data){
          const loc = (row[cUb]||'').toString().trim();
          if(!loc) continue;
          counts[loc] = (counts[loc]||0) + 1;
          total++;
        }
        stockCounts = counts;
        stockMeta = {filename: file.name, importedAt: new Date().toISOString(), totalLinhas: total};
        await storeSet('stock-data-latest', {counts: stockCounts, meta: stockMeta});
        await saveHistorySnapshot();
        savePainelData();
        showToast('Estoque importado e registro de ' + new Date().toLocaleDateString('pt-BR') + ' salvo no histórico.');
        render();
      }catch(err){
        console.error(err);
        showToast('Erro ao importar estoque: ' + err.message, true);
      }
    },
    error: (err) => showToast('Erro ao ler o CSV: ' + err.message, true)
  });
}

/* ---------------------------------------------------------------
   COMPUTATION
--------------------------------------------------------------- */
function computeOccupancy(){
  if(!capacityRows) return null;
  const counts = stockCounts || {};

  const groups = new Map(); // key tipo|||familia -> {tipo,familia,almacen,capacidade,ocupado,locs:[]}
  const almacens = new Map(); // almacen -> {capacidade, ocupado}
  let totalCap = 0, totalOcc = 0;

  for(const r of capacityRows){
    const key = r.tipo + '|||' + r.familia;
    if(!groups.has(key)){
      groups.set(key, {tipo:r.tipo, familia:r.familia, almacen:r.almacen, capacidade:0, ocupado:0, locs:[]});
    }
    const g = groups.get(key);
    g.capacidade += r.capacidade;
    if(!g.almacen) g.almacen = r.almacen;

    const n = counts[r.loc] || 0;
    const occ = Math.min(n, r.capacidade);
    g.ocupado += occ;
    g.locs.push({loc:r.loc, capacidade:r.capacidade, ocupado:occ, embalagens:n, livre: r.capacidade - occ});

    totalCap += r.capacidade;
    totalOcc += occ;

    const almKey = r.almacen || '—';
    if(!almacens.has(almKey)) almacens.set(almKey, {capacidade:0, ocupado:0});
    const a = almacens.get(almKey);
    a.capacidade += r.capacidade;
    a.ocupado += occ;
  }

  const groupList = Array.from(groups.values())
    .filter(g => g.capacidade > 0 || g.ocupado > 0)
    .sort((a,b) => a.tipo.localeCompare(b.tipo) || a.familia.localeCompare(b.familia));

  const almacenList = Array.from(almacens.entries())
    .map(([name, v]) => ({name, ...v, pct: v.capacidade ? 100*v.ocupado/v.capacidade : 0}))
    .sort((a,b) => b.capacidade - a.capacidade);

  const tiposUnicos = new Set(groupList.map(g=>g.tipo)).size;

  return {
    groupList, almacenList,
    totalCap, totalOcc,
    totalFree: totalCap - totalOcc,
    pctOcc: totalCap ? 100*totalOcc/totalCap : 0,
    tiposUnicos,
    totalFamilias: groupList.length,
  };
}

/* ---------------------------------------------------------------
   HISTORY
--------------------------------------------------------------- */
function todayKey(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
async function saveHistorySnapshot(){
  const stats = computeOccupancy();
  if(!stats) return;
  const key = 'history:' + todayKey();
  await storeSet(key, {
    date: todayKey(),
    capacidade: stats.totalCap,
    ocupado: stats.totalOcc,
    pct: stats.pctOcc,
    savedAt: new Date().toISOString(),
  });
}
async function loadHistory(){
  const keys = await storeList('history:');
  const dates = keys.map(k => k.replace('history:','')).sort().slice(-14);
  const entries = [];
  for(const d of dates){
    const v = await storeGet('history:' + d);
    if(v) entries.push(v);
  }
  return entries.sort((a,b) => a.date.localeCompare(b.date));
}

    <div class="panel-body">

      <td class="num">${fmtInt(g.ocupado)}</td>
      <td class="num disp-cell" data-gkey="${escapeHtml(gkey)}" title="Clique para ver as posições livres">${fmtInt(g.capacidade-g.ocupado)}</td>

  </div></div>`;

  html += '</div>'; // end left col

  // middle column: Ocupação geral -> data -> Resumo por armazém
  const ocupCor = pct>=90 ? 'var(--red)' : pct>=70 ? 'var(--amber)' : 'var(--green)';
  const todayLabel = new Date().toLocaleDateString('pt-BR', {weekday:'long', day:'2-digit', month:'long', year:'numeric'});

  html += '<div class="side-stack" id="midcol">';

  const maxCap = Math.max(...stats.almacenList.map(a=>a.capacidade), 1);
  almBox.innerHTML = stats.almacenList.map(a => `
    <div class="armazem-row">
      <div class="armazem-name">${escapeHtml(a.name.toUpperCase())}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${a.pct}%"></div></div>
      <div class="armazem-meta"><span>${fmtInt(a.capacidade)} cap · ${fmtInt(a.capacidade-a.ocupado)} disp</span><span>${fmtPct(a.pct)}</span></div>
    </div>
  `).join('');

  // history (async)
  const hist = await loadHistory();
  const histBox = document.getElementById('histBox');
  if(hist.length === 0){
    histBox.innerHTML = '<div class="hist-row"><span class="hist-date">Sem histórico ainda</span></div>';
  } else {
    let rows = '';
    for(let i=hist.length-1;i>=0;i--){
      const h = hist[i];
      const prev = hist[i-1];
      let trendHtml = '<span class="trend flat">—</span>';
      if(prev){
        const diff = h.pct - prev.pct;
        if(Math.abs(diff) >= 0.01){
          const arrow = diff > 0 ? '▲' : '▼';
          const cls = diff > 0 ? 'up' : 'down';
          trendHtml = `<span class="trend ${cls}">${arrow} ${Math.abs(diff).toFixed(2).replace('.',',')}%</span>`;
        }
      }
      rows += `<div class="hist-row">
        <span class="hist-date">${new Date(h.date+'T00:00:00').toLocaleDateString('pt-BR')}</span>
        <span class="mono">${fmtPct(h.pct)}</span>
        ${trendHtml}
      </div>`;
    }
    histBox.innerHTML = rows;
  }
}

function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  if(!currentStats) return;
  const g = currentStats.groupList.find(x => (x.tipo+'|||'+x.familia) === gkey);
  if(!g) return;

  const free = g.locs.filter(l => l.livre > 0).sort((a,b) => a.loc.localeCompare(b.loc, undefined, {numeric:true}));
  const full = g.locs.filter(l => l.livre <= 0).length;

  const root = document.getElementById('modalRoot');
  const rowsHtml = free.length ? free.map(l => `
    <tr>
      <td class="mono">${escapeHtml(l.loc)}</td>
      <td class="num">${fmtInt(l.capacidade)}</td>
      <td class="num">${fmtInt(l.ocupado)}</td>
      <td class="num" style="font-weight:600;color:var(--green);">${fmtInt(l.livre)}</td>
    </tr>
  `).join('') : `<tr><td colspan="4" style="text-align:center;padding:24px;color:var(--ink-soft);">Nenhuma posição livre nesta família — 100% ocupado.</td></tr>`;

      <div class="modal-box" role="dialog" aria-modal="true">
        <div class="modal-head">
          <div>
            <div class="modal-title">Posições livres — ${escapeHtml(g.familia)}</div>
            <div class="modal-sub">${escapeHtml(g.tipo)}${g.almacen ? ' · ' + escapeHtml(g.almacen) : ''}</div>
          </div>
          <button class="modal-close" id="modalCloseBtn" aria-label="Fechar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-actions">
          <button id="modalExportBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Exportar CSV
          </button>
          <button id="modalPrintBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            Imprimir
          </button>
        </div>
        <div class="modal-body">
          <table>
            <thead><tr><th>Posição</th><th class="num">Capacidade</th><th class="num">Ocupado</th><th class="num">Livre</th></tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
        <div class="modal-foot">${free.length} de ${g.locs.length} posições com espaço livre (${fmtInt(g.locs.reduce((s,l)=>s+l.livre,0))} slots disponíveis no total) · ${full} posições cheias</div>
      </div>
    </div>
  `;
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if(e.target.id === 'modalOverlay') closeModal();
  });
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('modalPrintBtn').addEventListener('click', () => window.print());
  document.getElementById('modalExportBtn').addEventListener('click', () => exportFreePositionsCSV(g, free));
  document.addEventListener('keydown', escCloseHandler);
}
function exportFreePositionsCSV(g, free){
  const lines = [['Posicao','Tipo de Armazenagem','Familia','Capacidade','Ocupado','Livre'].join(';')];
  for(const l of free){
    lines.push([l.loc, g.tipo, g.familia, l.capacidade, l.ocupado, l.livre].join(';'));
  }
  const csv = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeFam = g.familia.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-');
  a.href = url;
  a.download = 'posicoes-livres-' + safeFam + '-' + todayKey() + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV exportado: ' + free.length + ' posições livres.');
}
function escCloseHandler(e){
  if(e.key === 'Escape') closeModal();
}
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
  document.removeEventListener('keydown', escCloseHandler);
}

/* ---------------------------------------------------------------
   INIT — try to restore last session from persistent storage
--------------------------------------------------------------- */
/* ---------------- INTEGRAÇÃO COM O PAINEL (persistência na pasta compartilhada) ---------------- */
const PAINEL_TOOL_ID = 'ocupacao-estoque';
const embeddedInPainel = window.parent !== window;

function savePainelData(){
  if (!embeddedInPainel) return;
  window.parent.postMessage({
    type: 'painel:save-data',
    tool: PAINEL_TOOL_ID,
    payload: { capacityRows, capacityMeta, stockCounts, stockMeta, savedAt: Date.now() }
  }, '*');
}

function restorePainelData(payload){
  if (!payload) return;
  let changed = false;
  if (payload.capacityRows && (!capacityMeta || (payload.capacityMeta && new Date(payload.capacityMeta.importedAt) >= new Date(capacityMeta.importedAt)))){
    capacityRows = payload.capacityRows; capacityMeta = payload.capacityMeta; changed = true;
    storeSet('capacity-data', {rows: capacityRows, meta: capacityMeta});
  }
  if (payload.stockCounts && (!stockMeta || (payload.stockMeta && new Date(payload.stockMeta.importedAt) >= new Date(stockMeta.importedAt)))){
    stockCounts = payload.stockCounts; stockMeta = payload.stockMeta; changed = true;
    storeSet('stock-data-latest', {counts: stockCounts, meta: stockMeta});
  }
  if (changed){
    render();
    const quando = payload.savedAt ? new Date(payload.savedAt).toLocaleString('pt-BR') : '';
    showToast('🔄 Dados restaurados da pasta compartilhada' + (quando ? ' — ' + quando : ''));
  }
}

if (embeddedInPainel){
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'painel:data' && e.data.tool === PAINEL_TOOL_ID){
      restorePainelData(e.data.payload);
    }
  });
}

(async function init(){
  const cap = await storeGet('capacity-data');
  if(cap){ capacityRows = cap.rows; capacityMeta = cap.meta; }
  const stock = await storeGet('stock-data-latest');
  if(stock){ stockCounts = stock.counts; stockMeta = stock.meta; }
  render();
  if (embeddedInPainel){
    window.parent.postMessage({ type: 'painel:request-data', tool: PAINEL_TOOL_ID }, '*');
  }
})();
</script>
