<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Permanência de Embalagens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.5.4/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg-main:#F2F5F9;
  --bg-card:#FFFFFF;
  --bg-sidebar:#0B1220;
  --bg-sidebar-hover:#161F32;
  --sidebar-text:#8B96AC;
  --sidebar-text-active:#FFFFFF;
  --border:#E2E8F0;
  --border-strong:#CBD5E1;
  --text-primary:#0F172A;
  --text-secondary:#64748B;
  --text-tertiary:#94A3B8;
  --accent:#F0983D;
  --accent-dark:#C9791F;
  --accent-bg:#FFF1E0;
  --green:#15803D; --green-bg:#DCFCE7; --green-strong:#16A34A;
  --yellow:#A16207; --yellow-bg:#FEF9C3; --yellow-strong:#CA8A04;
  --orange:#C2410C; --orange-bg:#FFEDD5; --orange-strong:#EA580C;
  --red:#B91C1C; --red-bg:#FEE2E2; --red-strong:#DC2626;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --radius:10px;
  --shadow-card:0 1px 2px rgba(15,23,42,.04), 0 1px 6px rgba(15,23,42,.04);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--bg-main);
  color:var(--text-primary);
  font-size:14px;
  line-height:1.5;
  min-height:100vh;
}
.app{display:flex;min-height:100vh;}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:246px;flex:none;background:var(--bg-sidebar);color:var(--sidebar-text);
  display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px 8px;border-bottom:1px solid #1E293B;margin-bottom:16px;}
.brand-mark{
  width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#D97706);
  display:flex;align-items:center;justify-content:center;flex:none;
  font-family:var(--font-display);font-weight:700;color:#0B1220;font-size:15px;
}
.brand-text{display:flex;flex-direction:column;line-height:1.2;}
.brand-text b{font-family:var(--font-display);color:#fff;font-size:14.5px;letter-spacing:.2px;}
.brand-text span{font-size:11px;color:var(--sidebar-text);}

.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#4B5B76;padding:14px 10px 6px;font-weight:600;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;
  font-size:13px;color:var(--sidebar-text);border:none;background:transparent;width:100%;text-align:left;
  font-family:var(--font-body);transition:background .12s ease,color .12s ease;
}
.nav-item:hover{background:var(--bg-sidebar-hover);color:#E2E8F0;}
.nav-item.active{background:var(--accent-bg);color:#1F1300;font-weight:600;}
.nav-item.active .dot{background:var(--accent-dark);}
.nav-item .dot{width:7px;height:7px;border-radius:50%;background:#3A4863;flex:none;}
.nav-item .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav-item .count{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);}
.nav-item.active .count{color:#7A5320;}
.nav-item.critico-nav.active{background:var(--red-bg);color:var(--red);}
.nav-item.critico-nav.active .dot{background:var(--red-strong);}

.sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid #1E293B;display:flex;flex-direction:column;gap:8px;}
.import-status{font-size:11px;color:var(--sidebar-text);padding:0 8px;line-height:1.5;}
.import-status b{color:#E2E8F0;font-weight:600;}
.btn{
  font-family:var(--font-body);font-size:13px;font-weight:600;border-radius:8px;border:none;cursor:pointer;
  padding:9px 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:filter .12s ease,transform .05s ease;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--accent);color:#241400;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-ghost-dark{background:#161F32;color:#CBD5E1;}
.btn-ghost-dark:hover{background:#1E293B;}
.btn-secondary{background:#EEF2F7;color:var(--text-primary);}
.btn-secondary:hover{background:#E4E9F0;}
.btn-danger-ghost{background:transparent;color:var(--red-strong);border:1px solid #FCA5A5;}
.btn-danger-ghost:hover{background:var(--red-bg);}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:6px;}
#fileInput{display:none;}

/* ---------- MAIN ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  padding:18px 32px;background:var(--bg-card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;
}
.topbar h1{font-family:var(--font-display);font-size:19px;margin:0;color:var(--text-primary);}
.topbar .subtitle{font-size:12.5px;color:var(--text-secondary);margin-top:2px;}
.content{padding:26px 32px 60px;max-width:1400px;width:100%;margin:0 auto;}
.tab-panel{display:none;}
.tab-panel.visible{display:block;}

/* ---------- EMPTY STATE ---------- */
.empty-state{
  border:1.5px dashed var(--border-strong);border-radius:14px;padding:64px 32px;text-align:center;
  background:linear-gradient(180deg,#FFFFFF, #FBFCFE);
}
.empty-state .icon{
  width:56px;height:56px;border-radius:14px;background:var(--accent-bg);color:var(--accent-dark);
  display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:24px;
}
.empty-state h2{font-family:var(--font-display);font-size:18px;margin:0 0 8px;}
.empty-state p{color:var(--text-secondary);max-width:440px;margin:0 auto 22px;font-size:13.5px;}

/* ---------- KPI CARDS ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px;margin-bottom:22px;}
.kpi-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;
  box-shadow:var(--shadow-card);position:relative;overflow:hidden;
}
.kpi-card .kpi-label{font-size:11.5px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
.kpi-card .kpi-value{font-family:var(--font-display);font-size:26px;margin-top:6px;color:var(--text-primary);}
.kpi-card .kpi-sub{font-size:11.5px;color:var(--text-tertiary);margin-top:4px;}
.kpi-card.accent{border-color:#F6D9AE;}
.kpi-card.accent .kpi-value{color:var(--accent-dark);}
.kpi-card.danger .kpi-value{color:var(--red-strong);}
.kpi-card .rail{position:absolute;left:0;top:0;bottom:0;width:4px;}
.rail.green{background:var(--green-strong);} .rail.yellow{background:var(--yellow-strong);}
.rail.orange{background:var(--orange-strong);} .rail.red{background:var(--red-strong);}

.band-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
.band-card{border-radius:var(--radius);padding:13px 16px;border:1px solid var(--border);}
.band-card .n{font-family:var(--font-mono);font-size:20px;font-weight:600;}
.band-card .l{font-size:11.5px;margin-top:2px;font-weight:600;}
.band-card.g{background:var(--green-bg);} .band-card.g .n,.band-card.g .l{color:var(--green);}
.band-card.y{background:var(--yellow-bg);} .band-card.y .n,.band-card.y .l{color:var(--yellow);}
.band-card.o{background:var(--orange-bg);} .band-card.o .n,.band-card.o .l{color:var(--orange);}
.band-card.r{background:var(--red-bg);} .band-card.r .n,.band-card.r .l{color:var(--red);}

/* ---------- SECTION / CARD ---------- */
.section-title{font-family:var(--font-display);font-size:15px;margin:28px 0 12px;display:flex;align-items:center;justify-content:space-between;}
.section-title .hint{font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--text-tertiary);}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:18px;}
.charts-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:6px;}
.charts-grid-3{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;}
.chart-card h3{font-size:12.5px;font-weight:600;margin:0 0 12px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.03em;}
.chart-wrap{position:relative;height:220px;}
@media (max-width:980px){.charts-grid,.charts-grid-3{grid-template-columns:1fr;}}

/* Position overview cards on dashboard */
.pos-cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
.pos-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;
  transition:box-shadow .12s ease,transform .06s ease;box-shadow:var(--shadow-card);position:relative;
}
.pos-card:hover{box-shadow:0 4px 14px rgba(15,23,42,.08);transform:translateY(-1px);}
.pos-card .pos-name{font-weight:600;font-size:13px;margin-top:8px;}
.pos-card .pos-stats{display:flex;gap:14px;margin-top:10px;}
.pos-card .pos-stats div{font-size:11px;color:var(--text-secondary);}
.pos-card .pos-stats b{display:block;font-family:var(--font-mono);font-size:15px;color:var(--text-primary);font-weight:600;}
.status-chip{
  display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;
  text-transform:uppercase;letter-spacing:.02em;
}
.status-chip.g{background:var(--green-bg);color:var(--green);}
.status-chip.y{background:var(--yellow-bg);color:var(--yellow);}
.status-chip.o{background:var(--orange-bg);color:var(--orange);}
.status-chip.r{background:var(--red-bg);color:var(--red);}

/* ---------- TABLE TOOLBAR ---------- */
.table-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
.input, select.input{
  font-family:var(--font-body);font-size:12.5px;padding:8px 11px;border:1px solid var(--border-strong);
  border-radius:7px;background:#fff;color:var(--text-primary);outline:none;
}
.input:focus, select.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);}
.search-input{min-width:220px;flex:1;}
.day-range{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary);}
.day-range input{width:64px;}
.toolbar-spacer{flex:1;}
.result-count{font-size:12px;color:var(--text-secondary);white-space:nowrap;}

/* ---------- DATA TABLE ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;}
table.data-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px;}
table.data-table thead th{
  background:#F8FAFC;text-align:left;padding:10px 12px;font-weight:600;color:var(--text-secondary);
  border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;
}
table.data-table thead th:hover{color:var(--text-primary);}
table.data-table thead th.sorted::after{content:' ▾';color:var(--accent-dark);}
table.data-table thead th.sorted.asc::after{content:' ▴';}
table.data-table tbody td{padding:9px 12px;border-bottom:1px solid #F1F5F9;vertical-align:middle;}
table.data-table tbody tr:hover{background:#FAFBFD;}
table.data-table tbody tr:last-child td{border-bottom:none;}
.mono{font-family:var(--font-mono);}
.dim{color:var(--text-tertiary);}
.status-badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.status-badge .sw{width:7px;height:7px;border-radius:50%;flex:none;}
.status-badge.g{background:var(--green-bg);color:var(--green);} .status-badge.g .sw{background:var(--green-strong);}
.status-badge.y{background:var(--yellow-bg);color:var(--yellow);} .status-badge.y .sw{background:var(--yellow-strong);}
.status-badge.o{background:var(--orange-bg);color:var(--orange);} .status-badge.o .sw{background:var(--orange-strong);}
.status-badge.r{background:var(--red-bg);color:var(--red);} .status-badge.r .sw{background:var(--red-strong);}
.no-results{padding:36px;text-align:center;color:var(--text-tertiary);font-size:13px;}

/* ---------- CONFIG TAB ---------- */
.config-row{display:grid;grid-template-columns:1fr 110px 40px;gap:10px;align-items:center;margin-bottom:8px;}
.config-row input{width:100%;}
.config-head{display:grid;grid-template-columns:1fr 110px 40px;gap:10px;font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.03em;font-weight:600;margin-bottom:8px;padding:0 2px;}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:#F1F5F9;border:1px solid var(--border);color:var(--text-secondary);
  font-size:11.5px;padding:5px 10px;border-radius:20px;cursor:pointer;font-family:var(--font-mono);
}
.chip:hover{background:var(--accent-bg);border-color:#F6D9AE;color:var(--accent-dark);}
.chip-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
.remove-btn{
  width:28px;height:28px;border-radius:6px;border:1px solid var(--border-strong);background:#fff;color:var(--text-tertiary);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;
}
.remove-btn:hover{background:var(--red-bg);color:var(--red);border-color:#FCA5A5;}
.field-label{font-size:12.5px;font-weight:600;color:var(--text-primary);margin-bottom:8px;display:block;}
.help-text{font-size:12px;color:var(--text-tertiary);margin-top:6px;line-height:1.5;}
.config-actions{display:flex;gap:10px;margin-top:18px;}
.save-flash{font-size:12px;color:var(--green);font-weight:600;margin-left:4px;opacity:0;transition:opacity .3s ease;}
.save-flash.show{opacity:1;}

/* misc */
.jump-link{color:var(--accent-dark);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:2px;}
.crit-banner{
  display:flex;align-items:center;gap:10px;background:var(--red-bg);color:var(--red);border:1px solid #FCA5A5;
  padding:11px 16px;border-radius:8px;font-size:12.5px;margin-bottom:16px;font-weight:600;
}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:6px;}
.spin{
  width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

@media (max-width:860px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);z-index:50;transition:transform .18s ease;box-shadow:0 0 40px rgba(0,0,0,.3);}
  .sidebar.open{transform:translateX(0);}
  .content{padding:18px 16px 40px;}
  .topbar{padding:14px 16px;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .band-row{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">AP</div>
      <div class="brand-text"><b>Armazém Cummins</b><span>Permanência de embalagens</span></div>
    </div>

    <div class="nav-group-label">Visão Geral</div>
    <div class="nav" id="navTop">
      <button class="nav-item active" data-tab="dashboard"><span class="dot"></span><span class="label">Dashboard</span></button>
      <button class="nav-item critico-nav" data-tab="criticos"><span class="dot"></span><span class="label">Críticos</span><span class="count" id="navCriticoCount"></span></button>
    </div>

    <div class="nav-group-label">Posições Monitoradas</div>
    <div class="nav" id="navPositions"></div>

    <div class="nav-group-label">Sistema</div>
    <div class="nav">
      <button class="nav-item" data-tab="config"><span class="dot"></span><span class="label">Configurações</span></button>
    </div>

    <div class="sidebar-footer">
      <div class="import-status" id="importStatus">Nenhum arquivo importado ainda.</div>
      <input type="file" id="fileInput" accept=".csv">
      <button class="btn btn-primary" id="btnImport">⬆ Importar CSV</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="topbarTitle">Dashboard Geral</h1>
        <div class="subtitle" id="topbarSubtitle">Controle de tempo de permanência de embalagens por posição</div>
      </div>
      <button class="btn btn-secondary" id="btnMobileNav" style="display:none;">☰ Menu</button>
    </div>

    <div class="content">

      <!-- DASHBOARD -->
      <section class="tab-panel visible" id="tab-dashboard"></section>

      <!-- CRITICOS -->
      <section class="tab-panel" id="tab-criticos"></section>

      <!-- CONFIG -->
      <section class="tab-panel" id="tab-config"></section>

      <!-- POSITION TABS (dynamic) -->
      <div id="positionTabsContainer"></div>

    </div>
  </div>
</div>

<script>
/* =========================================================================
   CONFIG / CONSTANTS
   ========================================================================= */
const DEFAULT_POSITIONS = [
  { name: 'RECEBIMENTO', meta: 1 },
  { name: 'PEND-GUARDA', meta: 2 },
  { name: 'PROCESO-FAB1', meta: 3 },
  { name: 'PROCESO-FAB2', meta: 3 },
  { name: 'ENVIOS A TERCEIRO', meta: 5 },
  { name: 'EXP/AFTER/RES/F1', meta: 2 },
  { name: 'EXP AFTER/RESENDE/OUTROS F2', meta: 2 },
  { name: 'RECE_PS_FAB1', meta: 1 },
  { name: 'RECE_PS_FAB2', meta: 1 },
];

const REQUIRED_COLUMNS = ['label', 'Ubicacion', 'MOVEMENTDATE'];

/* =========================================================================
   STATE
   ========================================================================= */
const state = {
  positions: DEFAULT_POSITIONS.map(p => ({ ...p })), // working config
  rawRows: [],
  allCurrent: [],       // latest record per label (all positions)
  monitored: [],        // latest record per label, filtered to monitored positions
  byPosition: {},        // positionName -> array of records (with dias/status)
  positionFreq: [],      // [{name, count}] all Ubicacion values found in last import, for config helper
  history: [],           // array of daily snapshots from storage
  activeTab: 'dashboard',
  lastImport: null,      // {fileName, timestamp, rowCount}
  charts: {},             // chart.js instances keyed by canvas id
};

/* =========================================================================
   STORAGE HELPERS
   ========================================================================= */
const STORAGE_PREFIX = 'painelPermanencia:';
async function storageGet(key) {
  try {
    const v = localStorage.getItem(STORAGE_PREFIX + key);
    return v;
  } catch (e) { return null; }
}
async function storageSet(key, value) {
  try { localStorage.setItem(STORAGE_PREFIX + key, value); return true; }
  catch (e) { console.error('storage.set failed', key, e); return false; }
}
async function storageList(prefix) {
  try {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(STORAGE_PREFIX + prefix)) keys.push(k.slice(STORAGE_PREFIX.length));
    }
    return keys;
  } catch (e) { return []; }
}

async function loadConfigFromStorage() {
  const raw = await storageGet('config');
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length) return parsed;
    } catch (e) {}
  }
  return null;
}
async function saveConfigToStorage() {
  await storageSet('config', JSON.stringify(state.positions));
}
async function saveHistorySnapshot(snapshot) {
  await storageSet('history:' + snapshot.date, JSON.stringify(snapshot));
}
async function loadHistoryFromStorage() {
  const keys = await storageList('history:');
  const items = [];
  for (const k of keys) {
    const raw = await storageGet(k);
    if (raw) { try { items.push(JSON.parse(raw)); } catch (e) {} }
  }
  items.sort((a, b) => a.date.localeCompare(b.date));
  return items;
}

/* =========================================================================
   PARSING / DATE HELPERS
   ========================================================================= */
function normalize(s) { return (s || '').toString().trim().toUpperCase(); }

function parseDatePtBR(str) {
  if (!str) return null;
  str = str.toString().trim();
  if (!str) return null;
  const [datePart, timePart] = str.split(' ');
  if (!datePart) return null;
  const dParts = datePart.split('/');
  if (dParts.length !== 3) return null;
  const dd = Number(dParts[0]), mm = Number(dParts[1]), yyyy = Number(dParts[2]);
  if (!dd || !mm || !yyyy) return null;
  let hh = 0, min = 0;
  if (timePart) {
    const tParts = timePart.split(':');
    hh = Number(tParts[0]) || 0;
    min = Number(tParts[1]) || 0;
  }
  const dt = new Date(yyyy, mm - 1, dd, hh, min);
  if (isNaN(dt.getTime())) return null;
  return dt;
}

function formatDateTime(dt) {
  if (!dt) return '—';
  const p = n => String(n).padStart(2, '0');
  return `${p(dt.getDate())}/${p(dt.getMonth() + 1)}/${dt.getFullYear()} ${p(dt.getHours())}:${p(dt.getMinutes())}`;
}
function formatDateOnly(dt) {
  if (!dt) return '—';
  const p = n => String(n).padStart(2, '0');
  return `${p(dt.getDate())}/${p(dt.getMonth() + 1)}/${dt.getFullYear()}`;
}
function isoDate(dt) {
  const p = n => String(n).padStart(2, '0');
  return `${dt.getFullYear()}-${p(dt.getMonth() + 1)}-${p(dt.getDate())}`;
}
function daysBetween(dt, now) {
  const ms = now.getTime() - dt.getTime();
  return Math.max(0, Math.floor(ms / (1000 * 60 * 60 * 24)));
}
function fmtNumber(n) { return Number(n || 0).toLocaleString('pt-BR'); }
function fmtDecimal(n) { return Number(n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }

/* Status relative to a position's meta (dias parado vs meta) */
function getMetaStatus(dias, meta) {
  if (dias <= meta) return { level: 0, key: 'g', label: 'Dentro da meta' };
  if (dias <= meta * 2) return { level: 1, key: 'y', label: 'Atenção' };
  if (dias <= meta * 3) return { level: 2, key: 'o', label: 'Alerta' };
  return { level: 3, key: 'r', label: 'Crítico' };
}
/* Fixed-band status (0-7 / 8-15 / 16-30 / >30) used for the general overview */
function getFixedStatus(dias) {
  if (dias <= 7) return { key: 'g', label: '0–7 dias' };
  if (dias <= 15) return { key: 'y', label: '8–15 dias' };
  if (dias <= 30) return { key: 'o', label: '16–30 dias' };
  return { key: 'r', label: '> 30 dias' };
}
function statusBadgeHTML(status) {
  return `<span class="status-badge ${status.key}"><span class="sw"></span>${status.label}</span>`;
}

/* =========================================================================
   CSV PROCESSING
   ========================================================================= */
function processRows(rows) {
  const byLabel = new Map();
  let noDate = 0, noLabel = 0;
  const freq = new Map();

  for (const r of rows) {
    // Cada linha representa uma embalagem individual. A "labelorigin" identifica
    // essa embalagem especifica; quando ausente, cai para a "label" (etiqueta mãe),
    // que nesses casos já é única por linha. Isso evita que embalagens diferentes
    // que compartilham a mesma etiqueta mãe sejam agrupadas/descartadas entre si.
    const pkgKey = (r.labelorigin && r.labelorigin.trim()) || r.label;
    if (!pkgKey) { noLabel++; continue; }
    const posRaw = r.Ubicacion || '';
    freq.set(posRaw.trim(), (freq.get(posRaw.trim()) || 0) + 1);
    const dt = parseDatePtBR(r.MOVEMENTDATE);
    if (!dt) { noDate++; continue; }
    const existing = byLabel.get(pkgKey);
    if (!existing || dt > existing._dt) {
      byLabel.set(pkgKey, Object.assign({}, r, { _dt: dt, _pkgId: pkgKey }));
    }
  }

  const positionFreq = Array.from(freq.entries())
    .map(([name, count]) => ({ name, count }))
    .sort((a, b) => b.count - a.count);

  return {
    allCurrent: Array.from(byLabel.values()),
    noDate, noLabel,
    positionFreq,
  };
}

function recomputeMonitored() {
  const now = new Date();
  const targetMap = new Map(state.positions.map(p => [normalize(p.name), p]));

  state.monitored = state.allCurrent
    .filter(r => targetMap.has(normalize(r.Ubicacion)))
    .map(r => {
      const cfg = targetMap.get(normalize(r.Ubicacion));
      const dias = daysBetween(r._dt, now);
      const metaStatus = getMetaStatus(dias, cfg.meta);
      const fixedStatus = getFixedStatus(dias);
      return Object.assign({}, r, {
        _posCanonical: cfg.name,
        _meta: cfg.meta,
        dias, metaStatus, fixedStatus,
      });
    });

  const byPosition = {};
  for (const p of state.positions) byPosition[p.name] = [];
  for (const r of state.monitored) byPosition[r._posCanonical].push(r);
  state.byPosition = byPosition;
}

/* =========================================================================
   FILE IMPORT
   ========================================================================= */
function handleFile(file) {
  setImportStatus(`Importando "${file.name}"…`, true);
  try {
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      encoding: 'UTF-8',
      // worker:true foi removido: navegadores bloqueiam a criação de Web Workers
      // quando o arquivo HTML é aberto localmente (file://), o que travava a importação.
      complete: async (results) => {
        try {
          const fields = results.meta.fields || [];
          const missing = REQUIRED_COLUMNS.filter(c => !fields.includes(c));
          if (missing.length) {
            setImportStatus(`Erro: colunas ausentes no CSV (${missing.join(', ')}).`, false, true);
            return;
          }
          const processed = processRows(results.data);
          state.rawRows = results.data;
          state.allCurrent = processed.allCurrent;
          state.positionFreq = processed.positionFreq;
          state.lastImport = { fileName: file.name, timestamp: new Date(), rowCount: results.data.length };
          recomputeMonitored();
          await persistDailySnapshot();
          state.history = await loadHistoryFromStorage();
          renderAll();
          setImportStatus(null);
          savePainelData();
        } catch (e) {
          console.error(e);
          setImportStatus(`Erro ao processar o CSV: ${e.message}`, false, true);
        }
      },
      error: (err) => {
        console.error(err);
        setImportStatus('Erro ao ler o arquivo CSV.', false, true);
      }
    });
  } catch (e) {
    console.error(e);
    setImportStatus(`Erro ao iniciar a importação: ${e.message}`, false, true);
  }
}

async function persistDailySnapshot() {
  const now = new Date();
  const snapshot = {
    date: isoDate(now),
    timestamp: now.toISOString(),
    totalPackages: state.monitored.length,
    avgDias: state.monitored.length ? (state.monitored.reduce((s, r) => s + r.dias, 0) / state.monitored.length) : 0,
    positions: {},
  };
  for (const p of state.positions) {
    const arr = state.byPosition[p.name] || [];
    snapshot.positions[p.name] = {
      count: arr.length,
      avgDias: arr.length ? (arr.reduce((s, r) => s + r.dias, 0) / arr.length) : 0,
      qty: arr.reduce((s, r) => s + (Number(r.CantidadTotal) || 0), 0),
    };
  }
  await saveHistorySnapshot(snapshot);
}

function setImportStatus(msg, loading, isError) {
  const el = document.getElementById('importStatus');
  if (msg === null) {
    if (state.lastImport) {
      el.innerHTML = `Última importação:<br><b>${state.lastImport.fileName}</b><br>${formatDateTime(state.lastImport.timestamp)} · ${fmtNumber(state.lastImport.rowCount)} linhas`;
    } else {
      el.textContent = 'Nenhum arquivo importado ainda.';
    }
    return;
  }
  el.innerHTML = (loading ? '<span class="spin" style="border-top-color:#F0983D;border-color:rgba(240,152,61,.25)"></span> ' : '') +
    `<span style="color:${isError ? '#F87171' : '#CBD5E1'}">${msg}</span>`;
}

/* =========================================================================
   GENERIC SORTABLE / SEARCHABLE / FILTERABLE TABLE VIEW
   ========================================================================= */
function makeColumns(showPosition) {
  const cols = [
    { key: '_pkgId', label: 'Embalagem', mono: true, get: r => r._pkgId || r.label },
    { key: 'label', label: 'Etiqueta Mãe', mono: true, get: r => r.label },
    { key: 'Pieza', label: 'Item', mono: true, get: r => r.Pieza },
    { key: 'Descripcion1', label: 'Descrição', get: r => r.Descripcion1 || '—' },
    { key: 'Familia', label: 'Família', get: r => r.Familia || '—' },
  ];
  if (showPosition) cols.push({ key: '_posCanonical', label: 'Posição', get: r => r._posCanonical });
  cols.push(
    { key: 'CantidadTotal', label: 'Qtd', numeric: true, get: r => Number(r.CantidadTotal) || 0, fmt: v => fmtNumber(v) },
    { key: '_dt', label: 'Última Movimentação', numeric: true, get: r => r._dt.getTime(), fmt: (v, r) => formatDateTime(r._dt) },
    { key: 'dias', label: 'Dias Parado', numeric: true, get: r => r.dias, fmt: v => v },
    { key: 'metaStatus', label: 'Status', numeric: true, get: r => r.metaStatus.level, fmt: (v, r) => statusBadgeHTML(r.metaStatus) }
  );
  return cols;
}

/**
 * Builds a self-contained table block: search + familia filter + day range + sortable table + export.
 * Returns {html, mount} where mount(container, data) attaches listeners & does first render.
 */
function createTableBlock(opts) {
  const { idPrefix, showPosition, exportFileName, defaultSort = 'dias', defaultDir = 'desc' } = opts;
  const columns = makeColumns(showPosition);
  const sortState = { key: defaultSort, dir: defaultDir };

  const familias = Array.from(new Set(opts.data.map(r => r.Familia).filter(Boolean))).sort();

  const html = `
    <div class="table-toolbar">
      <input type="text" class="input search-input" id="${idPrefix}-search" placeholder="Buscar por embalagem, item ou descrição…">
      ${familias.length ? `<select class="input" id="${idPrefix}-familia"><option value="">Todas as famílias</option>${familias.map(f => `<option value="${escapeAttr(f)}">${escapeHtml(f)}</option>`).join('')}</select>` : ''}
      <div class="day-range">
        Dias:
        <input type="number" min="0" class="input" id="${idPrefix}-dmin" placeholder="mín">
        –
        <input type="number" min="0" class="input" id="${idPrefix}-dmax" placeholder="máx">
      </div>
      <div class="toolbar-spacer"></div>
      <span class="result-count" id="${idPrefix}-count"></span>
      <button class="btn btn-secondary btn-sm" id="${idPrefix}-export">⬇ Exportar Excel</button>
    </div>
    <div class="table-wrap">
      <table class="data-table" id="${idPrefix}-table">
        <thead><tr>${columns.map(c => `<th data-key="${c.key}">${c.label}</th>`).join('')}</tr></thead>
        <tbody id="${idPrefix}-tbody"></tbody>
      </table>
    </div>
  `;

  function mount(container, data) {
    container.innerHTML = html;
    const searchEl = document.getElementById(`${idPrefix}-search`);
    const familiaEl = document.getElementById(`${idPrefix}-familia`);
    const dminEl = document.getElementById(`${idPrefix}-dmin`);
    const dmaxEl = document.getElementById(`${idPrefix}-dmax`);
    const countEl = document.getElementById(`${idPrefix}-count`);
    const tbody = document.getElementById(`${idPrefix}-tbody`);
    const table = document.getElementById(`${idPrefix}-table`);

    function getFiltered() {
      const q = normalize(searchEl.value);
      const fam = familiaEl ? familiaEl.value : '';
      const dmin = dminEl.value !== '' ? Number(dminEl.value) : null;
      const dmax = dmaxEl.value !== '' ? Number(dmaxEl.value) : null;
      let rows = data.filter(r => {
        if (q) {
          const hay = normalize(`${r._pkgId || ''} ${r.label} ${r.Pieza} ${r.Descripcion1}`);
          if (!hay.includes(q)) return false;
        }
        if (fam && r.Familia !== fam) return false;
        if (dmin !== null && r.dias < dmin) return false;
        if (dmax !== null && r.dias > dmax) return false;
        return true;
      });
      const col = columns.find(c => c.key === sortState.key);
      rows.sort((a, b) => {
        let av = col.get(a), bv = col.get(b);
        if (typeof av === 'string') av = av.toLowerCase();
        if (typeof bv === 'string') bv = bv.toLowerCase();
        if (av < bv) return sortState.dir === 'asc' ? -1 : 1;
        if (av > bv) return sortState.dir === 'asc' ? 1 : -1;
        return 0;
      });
      return rows;
    }

    function renderRows() {
      const rows = getFiltered();
      countEl.textContent = `${fmtNumber(rows.length)} de ${fmtNumber(data.length)} embalagem(ns)`;
      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="${columns.length}"><div class="no-results">Nenhum resultado encontrado para os filtros aplicados.</div></td></tr>`;
      } else {
        tbody.innerHTML = rows.map(r => `<tr>${columns.map(c => {
          const raw = c.get(r);
          const val = c.fmt ? c.fmt(raw, r) : escapeHtml(raw);
          return `<td class="${c.mono ? 'mono' : ''}">${val}</td>`;
        }).join('')}</tr>`).join('');
      }
      table.querySelectorAll('thead th').forEach(th => {
        th.classList.toggle('sorted', th.dataset.key === sortState.key);
        th.classList.toggle('asc', th.dataset.key === sortState.key && sortState.dir === 'asc');
      });
    }

    [searchEl, familiaEl, dminEl, dmaxEl].forEach(el => {
      if (!el) return;
      el.addEventListener('input', renderRows);
      el.addEventListener('change', renderRows);
    });
    table.querySelectorAll('thead th').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.key;
        if (sortState.key === key) sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
        else { sortState.key = key; sortState.dir = 'desc'; }
        renderRows();
      });
    });
    document.getElementById(`${idPrefix}-export`).addEventListener('click', () => {
      const rows = getFiltered();
      exportRowsToExcel(rows, showPosition, exportFileName);
    });

    renderRows();
  }

  return { mount };
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

function exportRowsToExcel(rows, showPosition, filename) {
  const data = rows.map(r => {
    const obj = {
      'Embalagem': r._pkgId || r.label,
      'Etiqueta Mãe': r.label,
      'Item': r.Pieza,
      'Descrição': r.Descripcion1 || '',
      'Família': r.Familia || '',
    };
    if (showPosition) obj['Posição'] = r._posCanonical;
    obj['Quantidade'] = Number(r.CantidadTotal) || 0;
    obj['Última Movimentação'] = formatDateTime(r._dt);
    obj['Dias Parado'] = r.dias;
    obj['Meta (dias)'] = r._meta;
    obj['Status'] = r.metaStatus.label;
    return obj;
  });
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Dados');
  XLSX.writeFile(wb, filename);
}

  const wrap = document.getElementById('evolutionWrap');
  if (state.history.length < 2) {
    wrap.innerHTML = `<div class="no-results" style="padding-top:60px;">Histórico insuficiente ainda.<br>Cada importação salva um snapshot diário — volte a importar o CSV em outro dia para ver a evolução ao longo do tempo.</div>`;
  } else {
    wrap.innerHTML = '<canvas id="chartEvolution"></canvas>';
    state.charts.chartEvolution = new Chart(document.getElementById('chartEvolution'), {
      type: 'line',
      data: {
        labels: state.history.map(h => h.date.split('-').reverse().join('/')),
        datasets: [{
          label: 'Embalagens monitoradas', data: state.history.map(h => h.totalPackages),
          borderColor: '#F0983D', backgroundColor: 'rgba(240,152,61,.12)', fill: true, tension: 0.25, pointRadius: 3
        }]
      },
      options: chartBaseOptions('Embalagens', true)
    });
  }
}

function chartBaseOptions(yLabel, beginAtZero) {
  return {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
    scales: {
      x: { ticks: { font: { size: 10 }, maxRotation: 40, minRotation: 0 }, grid: { display: false } },
      y: { beginAtZero: !!beginAtZero, ticks: { font: { size: 10 } }, grid: { color: '#F1F5F9' } }
    }
  };
}

function renderDashboardTable() {
  const card = document.getElementById('dashboardTableCard');
  const block = createTableBlock({
    idPrefix: 'dash', showPosition: true, exportFileName: 'embalagens_monitoradas.xlsx',
    data: state.monitored, defaultSort: 'dias', defaultDir: 'desc'
  });
  block.mount(card, state.monitored);
}

/* =========================================================================
   RENDER: CRÍTICOS
   ========================================================================= */
function renderCriticos() {
  const el = document.getElementById('tab-criticos');
  if (!state.lastImport) {
    el.innerHTML = `<div class="empty-state"><div class="icon">🚨</div><h2>Nenhum dado importado</h2><p>Importe um CSV para visualizar as embalagens que ultrapassaram a meta de permanência.</p></div>`;
    return;
  }
  const critical = state.monitored.filter(r => r.dias > r._meta);
  el.innerHTML = `
    <div class="crit-banner">🚨 ${fmtNumber(critical.length)} embalagem(ns) ultrapassaram a meta de permanência definida para sua posição.</div>
    <div class="card" id="critTableCard"></div>
  `;
  const block = createTableBlock({
    idPrefix: 'crit', showPosition: true, exportFileName: 'embalagens_criticas.xlsx',
    data: critical, defaultSort: 'dias', defaultDir: 'desc'
  });
  block.mount(document.getElementById('critTableCard'), critical);
  document.getElementById('navCriticoCount').textContent = critical.length ? fmtNumber(critical.length) : '';
}

/* =========================================================================
   RENDER: POSITION TABS
   ========================================================================= */
function slug(name) { return normalize(name).replace(/[^A-Z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }

function renderPositionTabs() {
  const navContainer = document.getElementById('navPositions');
  const contentContainer = document.getElementById('positionTabsContainer');
  navContainer.innerHTML = '';
  contentContainer.innerHTML = '';

  state.positions.forEach(p => {
    const tabId = 'pos-' + slug(p.name);
    const navBtn = document.createElement('button');
    navBtn.className = 'nav-item';
    navBtn.dataset.tab = tabId;
    navBtn.innerHTML = `<span class="dot"></span><span class="label">${escapeHtml(p.name)}</span><span class="count">${(state.byPosition[p.name] || []).length || ''}</span>`;
    navBtn.addEventListener('click', () => switchTab(tabId));
    navContainer.appendChild(navBtn);

    const section = document.createElement('section');
    section.className = 'tab-panel';
    section.id = 'tab-' + tabId;
    contentContainer.appendChild(section);
    renderPositionTab(p, section);
  });
}

function renderPositionTab(p, section) {
  if (!state.lastImport) {
    section.innerHTML = `<div class="empty-state"><div class="icon">📍</div><h2>${escapeHtml(p.name)}</h2><p>Importe um CSV para ver as embalagens armazenadas nesta posição.</p></div>`;
    return;
  }
  const arr = state.byPosition[p.name] || [];
  const avg = arr.length ? arr.reduce((s, r) => s + r.dias, 0) / arr.length : 0;
  const max = arr.length ? Math.max(...arr.map(r => r.dias)) : 0;
  const foraMeta = arr.filter(r => r.dias > p.meta).length;
  const qty = arr.reduce((s, r) => s + (Number(r.CantidadTotal) || 0), 0);

  section.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-label">Embalagens</div><div class="kpi-value">${fmtNumber(arr.length)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Quantidade Total</div><div class="kpi-value">${fmtNumber(qty)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Tempo Médio</div><div class="kpi-value">${fmtDecimal(avg)}<span style="font-size:13px;color:var(--text-tertiary);"> dias</span></div></div>
      <div class="kpi-card"><div class="kpi-label">Tempo Máximo</div><div class="kpi-value">${fmtNumber(max)}<span style="font-size:13px;color:var(--text-tertiary);"> dias</span></div></div>
      <div class="kpi-card danger"><div class="rail red"></div><div class="kpi-label">Acima da Meta (${p.meta}d)</div><div class="kpi-value">${fmtNumber(foraMeta)}</div></div>
    </div>
    <div class="card" id="table-${slug(p.name)}"></div>
  `;
  const block = createTableBlock({
    idPrefix: 'p' + slug(p.name), showPosition: false,
    exportFileName: `${p.name.replace(/[^a-zA-Z0-9]+/g, '_')}.xlsx`,
    data: arr, defaultSort: 'dias', defaultDir: 'desc'
  });
  block.mount(document.getElementById(`table-${slug(p.name)}`), arr);
}

/* =========================================================================
   RENDER: CONFIG
   ========================================================================= */
function renderConfig() {
  const el = document.getElementById('tab-config');
  el.innerHTML = `
    <div class="card" style="max-width:760px;">
      <span class="field-label">Posições monitoradas e metas de permanência (dias)</span>
      <div class="config-head"><span>Posição (Ubicacion)</span><span>Meta (dias)</span><span></span></div>
      <div id="configRows"></div>
      <button class="btn btn-secondary btn-sm" id="addPosBtn" style="margin-top:6px;">+ Adicionar posição</button>

      ${state.positionFreq.length ? `
      <div style="margin-top:22px;">
        <span class="field-label">Posições encontradas no último CSV importado</span>
        <div class="help-text">Clique para adicionar rapidamente à lista de monitoramento.</div>
        <div class="chip-wrap" id="freqChips"></div>
      </div>` : ''}

      <div class="config-actions">
        <button class="btn btn-primary" id="saveConfigBtn">💾 Salvar configurações</button>
        <button class="btn btn-secondary" id="resetConfigBtn">Restaurar padrão</button>
        <span class="save-flash" id="saveFlash">Salvo ✓</span>
      </div>
      <div class="help-text" style="margin-top:14px;">
        As metas definem os status de cada embalagem: 🟢 dentro da meta · 🟡 até 2× a meta (atenção) · 🟠 até 3× a meta (alerta) · 🔴 acima de 3× a meta (crítico).
        As configurações ficam salvas neste navegador e são usadas em todas as próximas importações.
      </div>
    </div>
  `;
  renderConfigRows();
  document.getElementById('addPosBtn').addEventListener('click', () => {
    state.positions.push({ name: '', meta: 2 });
    renderConfigRows();
  });
  document.getElementById('saveConfigBtn').addEventListener('click', onSaveConfig);
  document.getElementById('resetConfigBtn').addEventListener('click', () => {
    state.positions = DEFAULT_POSITIONS.map(p => ({ ...p }));
    renderConfigRows();
  });
  if (state.positionFreq.length) renderFreqChips();
}

function renderConfigRows() {
  const wrap = document.getElementById('configRows');
  wrap.innerHTML = state.positions.map((p, i) => `
    <div class="config-row">
      <input type="text" class="input" data-idx="${i}" data-field="name" value="${escapeAttr(p.name)}" placeholder="Ex: RECEBIMENTO">
      <input type="number" min="1" class="input" data-idx="${i}" data-field="meta" value="${p.meta}">
      <button class="remove-btn" data-idx="${i}" title="Remover">✕</button>
    </div>
  `).join('');
  wrap.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', (e) => {
      const idx = Number(e.target.dataset.idx);
      const field = e.target.dataset.field;
      state.positions[idx][field] = field === 'meta' ? Number(e.target.value || 1) : e.target.value;
    });
  });
  wrap.querySelectorAll('.remove-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const idx = Number(e.target.dataset.idx);
      state.positions.splice(idx, 1);
      renderConfigRows();
    });
  });
}

function renderFreqChips() {
  const wrap = document.getElementById('freqChips');
  const existing = new Set(state.positions.map(p => normalize(p.name)));
  wrap.innerHTML = state.positionFreq.slice(0, 40).map(f =>
    `<span class="chip" data-name="${escapeAttr(f.name)}">${escapeHtml(f.name)} <span class="dim">(${fmtNumber(f.count)})</span>${existing.has(normalize(f.name)) ? ' ✓' : ''}</span>`
  ).join('');
  wrap.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const name = chip.dataset.name;
      if (!state.positions.some(p => normalize(p.name) === normalize(name))) {
        state.positions.push({ name, meta: 2 });
        renderConfigRows();
        renderFreqChips();
      }
    });
  });
}

async function onSaveConfig() {
  state.positions = state.positions.filter(p => p.name && p.name.trim());
  await saveConfigToStorage();
  if (state.lastImport) {
    recomputeMonitored();
    renderAll();
    switchTab('config');
  } else {
    renderConfigRows();
  }
  const flash = document.getElementById('saveFlash');
  if (flash) {
    flash.classList.add('show');
    setTimeout(() => flash.classList.remove('show'), 1800);
  }
}

/* =========================================================================
   TAB SWITCHING / GLOBAL RENDER
   ========================================================================= */
const TAB_TITLES = {
  dashboard: ['Dashboard Geral', 'Controle de tempo de permanência de embalagens por posição'],
  criticos: ['Embalagens Críticas', 'Embalagens que ultrapassaram a meta de permanência, de todas as posições'],
  config: ['Configurações', 'Gerencie as posições monitoradas e suas metas de permanência'],
};

function switchTab(tabId) {
  state.activeTab = tabId;
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('visible'));
  const panel = document.getElementById('tab-' + tabId);
  if (panel) panel.classList.add('visible');
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));

  let title = TAB_TITLES[tabId];
  if (!title) {
    const pos = state.positions.find(p => 'pos-' + slug(p.name) === tabId);
    title = pos ? [pos.name, `Meta de permanência: ${pos.meta} dia(s) · Posição monitorada`] : ['—', ''];
  }
  document.getElementById('topbarTitle').textContent = title[0];
  document.getElementById('topbarSubtitle').textContent = title[1];

  const sidebar = document.getElementById('sidebar');
  if (window.innerWidth <= 860) sidebar.classList.remove('open');
}

function renderAll() {
  renderDashboard();
  renderCriticos();
  renderPositionTabs();
  renderConfig();
  switchTab(state.activeTab);
  setImportStatus(null);
}

/* =========================================================================
   INIT / EVENT WIRING
   ========================================================================= */
document.getElementById('btnImport').addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', (e) => {
  if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
  e.target.value = '';
});
document.querySelectorAll('.nav-item[data-tab]').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});
document.getElementById('btnMobileNav').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});
function checkMobileNav() {
  document.getElementById('btnMobileNav').style.display = window.innerWidth <= 860 ? 'inline-flex' : 'none';
}
window.addEventListener('resize', checkMobileNav);
checkMobileNav();

/* =========================================================================
   INTEGRAÇÃO COM O PAINEL (persistência na pasta compartilhada)
   ========================================================================= */
const PAINEL_TOOL_ID = 'backlog-embalagens';
const embeddedInPainel = window.parent !== window;

function savePainelData(){
  if (!embeddedInPainel) return;
  window.parent.postMessage({
    type: 'painel:save-data',
    tool: PAINEL_TOOL_ID,
    payload: { rawRows: state.rawRows, lastImport: state.lastImport, savedAt: Date.now() }
  }, '*');
}

async function restorePainelData(payload){
  if (!payload || !Array.isArray(payload.rawRows) || !payload.rawRows.length) return;
  const processed = processRows(payload.rawRows);
  state.rawRows = payload.rawRows;
  state.allCurrent = processed.allCurrent;
  state.positionFreq = processed.positionFreq;
  state.lastImport = payload.lastImport || { fileName: 'restaurado', timestamp: new Date(), rowCount: payload.rawRows.length };
  recomputeMonitored();
  await persistDailySnapshot();
  state.history = await loadHistoryFromStorage();
  renderAll();
  setImportStatus(null);
  const quando = payload.savedAt ? new Date(payload.savedAt).toLocaleString('pt-BR') : '';
  console.log('Painel: dados restaurados' + (quando ? ' — ' + quando : ''));
}

if (embeddedInPainel){
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'painel:data' && e.data.tool === PAINEL_TOOL_ID){
      restorePainelData(e.data.payload);
    }
  });
}

async function init() {
  const savedConfig = await loadConfigFromStorage();
  if (savedConfig) state.positions = savedConfig;
  state.history = await loadHistoryFromStorage();
  renderAll();
  if (embeddedInPainel){
    window.parent.postMessage({ type: 'painel:request-data', tool: PAINEL_TOOL_ID }, '*');
  }
}
init();
</script>
